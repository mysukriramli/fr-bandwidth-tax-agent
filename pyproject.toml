[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fr-bandwidth-tax-agent"
version = "0.1.0"
description = "Deterministic computation, simulation, and audit engine for French digital bandwidth tax (Amendment n°I-1358)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
